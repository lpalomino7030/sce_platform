spring.application.name=sce-platform

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sce_platform}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

sce.security.jwt.secret=${JWT_SECRET}

sce.bootstrap-admin.enabled=${SCE_BOOTSTRAP_ADMIN_ENABLED:true}

SCE_BOOTSTRAP_ADMIN_ENABLED=true
SCE_BOOTSTRAP_ADMIN_USERNAME=admin_sce
SCE_BOOTSTRAP_ADMIN_EMAIL=admin@sce.com
SCE_BOOTSTRAP_ADMIN_PASSWORD=1234567890
SCE_BOOTSTRAP_ADMIN_NAMES=Administrador
SCE_BOOTSTRAP_ADMIN_LASTNAMES=Plataforma

sce.security.jwt.expiration-minutes=30

management.endpoints.web.exposure.include=health,info

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true