<section class="tenant-page overlay"
>

  <div class="modal"
       (click)="$event.stopPropagation()">

    <div class="tenant-title">
      <p>Agregar Nuevo Tenant</p>

      <button
        type="button"
        class="btn-cerrar-modalTenants"
        (click)="cerrarModal()"
        aria-label="Cerrar modal">
        ×
      </button>
    </div>

    <form >
      <div>
        <label> Datos del tenant</label>
        <div class="form-group">
          <label class="" for="ruc">Ruc</label>
          <input class="form-control" id="ruc" type="text"/>
        </div>
        <div class="form-group">

          <label class="" for="nombre">Nombre</label>
          <input class="form-control" id="nombre" type="text"/>
        </div>
        <div class="form-group">

          <label class="" for="razonSocial">Razon Social</label>
          <input class="form-control" id="razonSocial" type="text"/>
        </div>
      </div>
      <div>
        <label>Datos de Owner</label>


      </div>


      <button type="submit">Aceptar</button>
      <!--      <button (click)="cerrarModalTenant()"></button>-->
    </form>
  </div>


</section>
