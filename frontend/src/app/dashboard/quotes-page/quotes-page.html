<div class="quotes-tittle">
  <p class="quotes-page-tittle">Cotizaciones</p>
  <small class="quotes-page-description">Administra, consulta y realiza seguimiento de tus propuestas
    comerciales.</small>

</div>
<div class="mode-quotes-group">
  <div class="card-mode-quotes">
    <div class="btn-table-mode" (click)="onChangeVista('Tabla')">Tabla</div>
    <div class="btn-kanban-mode" (click)="onChangeVista('Kanban')">Kanban</div>
  </div>
  <div class="btn-newquote">Nueva cotizacion</div>
</div>
@if (selectedVista === 'Tabla') {
<div class="group-card-reports">
  <app-card-quotes-reports
    class="card-reports-item"
    legend="Total de cotizaciones"
    count="5"
    suggestion="lorem"
    [style.background-color]="'#ADD8E655'"
  />
  <app-card-quotes-reports
    class="card-reports-item"
    legend="En negociacion"
    count="5"
    suggestion="lorem"
    [style.background-color]="'#FAFAD255'"
  />
  <app-card-quotes-reports
    class="card-reports-item"
    legend="Aceptados"
    count="5"
    suggestion="lorem"
    [style.background-color]="'#90EE9055'"
  />
  <app-card-quotes-reports
    class="card-reports-item"
    legend="Valorizacion"
    count="5"
    suggestion="lorem"
    [style.background-color]="'#c6a2e455'"
  />


</div>
<app-table-quote-list/>
}
